name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:

  format:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format
      - name: clang-format dry-run
        run: |
          set -e
          files=$(find src tests bench -name '*.h' -o -name '*.cpp')
          echo "$files"
          clang-format --dry-run --Werror $files

  build-gcc:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build
      - name: configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: build
        run: cmake --build build -j
      - name: unit + integration tests
        run: cd build && ctest --output-on-failure -j

  build-clang:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build clang
      - name: configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
      - name: build
        run: cmake --build build -j
      - name: unit + integration tests
        run: cd build && ctest --output-on-failure -j

  asan:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build clang
      - name: configure asan
        run: |
          cmake -S . -B build-asan -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DMDFEED_ASAN=ON \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
      - name: build
        run: cmake --build build-asan -j
      - name: tests under asan + ubsan
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: cd build-asan && ctest --output-on-failure -j

  fuzz-smoke:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build clang
      - name: configure fuzz
        run: |
          cmake -S . -B build-fuzz -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DMDFEED_BUILD_TESTS=OFF \
            -DMDFEED_BUILD_FUZZ=ON \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
      - name: build fuzz harnesses
        run: cmake --build build-fuzz -j
      - name: smoke fuzz venue A
        run: build-fuzz/normalize_a_fuzz -runs=5000
      - name: smoke fuzz venue B
        run: build-fuzz/normalize_b_fuzz -runs=5000

  bench-smoke:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build
      - name: configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: build
        run: cmake --build build -j
      - name: smoke bench (1k msgs/sec over loopback)
        run: |
          mkdir -p bench/results
          # 30k msgs at 1000/sec = 30 seconds; honest smoke, no perf claims here.
          build/loopback_bench \
            --count=30000 --rate=1000 --port=52424 \
            --out=bench/results/bench_ci.json
          echo "--- bench result ---"
          cat bench/results/bench_ci.json
      - uses: actions/upload-artifact@v4
        with:
          name: bench-ci-result
          path: bench/results/bench_ci.json

  docker:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: set up buildx
        uses: docker/setup-buildx-action@v3
      - name: build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: mdfeed-handler:ci
          load: true
      - name: sanity-list binaries
        run: |
          docker run --rm --entrypoint=/bin/ls mdfeed-handler:ci /usr/local/bin/
